<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#5b9e45"><title>Little Farmer — Farm Pack Rebuild</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#315b32;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.panel{background:#f7e7bd;border:2px solid #5a3822;color:#3b2719;border-radius:10px;font-weight:800;box-shadow:0 3px 0 #0004}#hud{position:fixed;top:max(6px,env(safe-area-inset-top));left:6px;right:6px;display:flex;gap:4px;flex-wrap:wrap;z-index:3;pointer-events:none}#hud span{padding:4px 7px;font-size:12px}#animalhud{position:fixed;top:68px;right:7px;z-index:3;padding:4px 7px;font-size:11px}#mission{position:fixed;top:68px;left:7px;max-width:61vw;z-index:3;padding:5px 8px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#msg{position:fixed;top:104px;left:50%;transform:translateX(-50%);padding:6px 9px;z-index:4;opacity:0;transition:.2s;white-space:nowrap;font-size:12px}#joy{position:fixed;left:16px;bottom:max(20px,env(safe-area-inset-bottom));width:98px;height:98px;border:3px solid #ead9ae;border-radius:50%;background:#0004;touch-action:none;z-index:3}#stick{position:absolute;width:44px;height:44px;border-radius:50%;background:#f7e7bd;border:3px solid #5a3822;left:24px;top:24px}#actions{position:fixed;right:10px;bottom:max(16px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,88px);gap:5px;z-index:3}button{min-height:42px;border-radius:11px;border:2px solid #5a3822;background:#f7e7bd;color:#3b2719;font-weight:900;font-size:12px;box-shadow:0 3px 0 #0004}button:active{transform:translateY(2px);box-shadow:0 1px 0 #0004}#inv{grid-column:1/3;background:#cda7df}@media(max-width:390px){#actions{grid-template-columns:repeat(2,84px)}button{font-size:11px}#mission{max-width:56vw}}</style></head><body><div id="hud"><span class="panel">DAY <b id="day">1</b></span><span class="panel">🪙 <b id="coins">0</b></span><span class="panel">⚡ <b id="stam">100</b></span><span class="panel">🪵 <b id="wood">0</b></span><span class="panel">🪨 <b id="stone">0</b></span><span class="panel">🌾 <b id="wheat">0</b></span></div><div id="mission" class="panel">MISSION: Follow SEED SHOP arrow</div><div id="animalhud" class="panel">🐔0 🐄0 🥚0 🥛0</div><div id="msg" class="panel"></div><canvas id="game"></canvas><div id="joy"><div id="stick"></div></div><div id="actions"><button id="tool">TOOL: AXE</button><button id="use">USE</button><button id="plant">PLANT</button><button id="sell">SELL</button><button id="inv">INVENTORY</button></div><script src="game.js?v=8"></script><script src="player-fix.js?v=4"></script><script src="town.js?v=5"></script><script src="animals.js?v=3"></script><script src="town-polish.js?v=2"></script></body></html>
