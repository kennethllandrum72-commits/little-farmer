<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#5b9e45"><title>Little Farmer — Farm Pack Rebuild</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#315b32;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.panel{background:#f7e7bd;border:3px solid #5a3822;color:#3b2719;border-radius:12px;font-weight:800;box-shadow:0 4px 0 #0004}#hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:3;pointer-events:none}#hud span{padding:6px 9px;font-size:14px}#msg{position:fixed;top:88px;left:50%;transform:translateX(-50%);padding:8px 12px;z-index:4;opacity:0;transition:.2s;white-space:nowrap}#joy{position:fixed;left:20px;bottom:max(24px,env(safe-area-inset-bottom));width:120px;height:120px;border:4px solid #ead9ae;border-radius:50%;background:#0004;touch-action:none;z-index:3}#stick{position:absolute;width:54px;height:54px;border-radius:50%;background:#f7e7bd;border:4px solid #5a3822;left:29px;top:29px}#actions{position:fixed;right:16px;bottom:max(20px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,104px);gap:8px;z-index:3}button{min-height:52px;border-radius:14px;border:3px solid #5a3822;background:#f7e7bd;color:#3b2719;font-weight:900;font-size:15px;box-shadow:0 4px 0 #0004}button:active{transform:translateY(2px);box-shadow:0 2px 0 #0004}#inv{grid-column:1/3;background:#cda7df}</style></head><body><div id="hud"><span class="panel">🪙 <b id="coins">0</b></span><span class="panel">⚡ <b id="stam">100</b></span><span class="panel">🪵 <b id="wood">0</b></span><span class="panel">🪨 <b id="stone">0</b></span><span class="panel">🌾 <b id="wheat">0</b></span></div><div id="msg" class="panel"></div><canvas id="game"></canvas><div id="joy"><div id="stick"></div></div><div id="actions"><button id="tool">TOOL: AXE</button><button id="use">USE</button><button id="plant">PLANT</button><button id="sell">SELL</button><button id="inv">INVENTORY</button></div><script src="game.js?v=5"></script></body></html>
